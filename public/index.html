<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M-Pesa STK Push</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="card">
    <div class="brand">M-PESA</div>
    <h1>Pay securely</h1>
    <p>Receive an M-Pesa prompt on your phone.</p>

    <form id="payment-form">
      <label for="phone">Phone number</label>
      <input id="phone" name="phone" type="tel" inputmode="numeric" placeholder="0712345678" required>

      <label for="amount">Amount (KES)</label>
      <input id="amount" name="amount" type="number" inputmode="numeric" min="1" step="1" placeholder="100" required>

      <button id="submit-button" type="submit">Send STK Push</button>
    </form>

    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
